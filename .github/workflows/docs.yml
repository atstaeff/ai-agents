name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'PROJECT.md'
      - 'AGENTS.md'
      - 'knowledge/**'
      - 'agents/**'
      - 'skills/**'
      - 'toolkit/**'
      - 'templates/**'
      - 'tools/ai_toolkit.py'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Validate canonical catalog
        run: python3 tools/ai_toolkit.py check
      - name: Install locked website dependencies
        run: npm --prefix website ci
      - name: Build Docusaurus into the existing Pages directory
        run: npm --prefix website run build -- --out-dir ../docs
      - name: Add .nojekyll
        run: touch docs/.nojekyll
      - name: Commit docs/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to docs — skipping commit"
          else
            git commit -m "docs: rebuild Docusaurus site"
            # A newer main commit must be rebuilt by its own run, not overwritten.
            git push
          fi
