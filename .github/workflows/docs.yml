name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'assets/mkdocs/**'
      - 'assets/mkdocs.yml'
      - 'agents/**'
      - 'skills/**'
      - 'toolkit/**'
      - 'templates/**'
      - 'tools/docs_hook.py'
      - 'tools/ai_toolkit.py'
      - 'CONTRIBUTING.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reproducible documentation environment
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --group docs

      - name: Validate canonical catalog
        run: python3 tools/ai_toolkit.py check

      - name: Build documentation
        run: uv run --locked --group docs mkdocs build -f assets/mkdocs.yml --strict

      - name: Add .nojekyll
        run: touch docs/.nojekyll

      - name: Commit docs/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to docs — skipping commit"
          else
            git commit -m "docs: rebuild documentation site"
            # A newer main commit must be rebuilt by its own run, not overwritten.
            git push
          fi
