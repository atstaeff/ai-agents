name: Validate Toolkit

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Validate catalog and local links
        run: python3 tools/ai_toolkit.py check
      - name: Test exports, storage, HTTP and website publishing
        run: python3 -m unittest discover -s tests -v
      - name: Replay the local workspace process
        run: python3 tools/workspace_smoke.py
      - name: Check frontend JavaScript syntax
        run: node --check tools/web/app.js
      - name: Install reproducible validation environment
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --group validation
      - name: Validate optional project example helpers
        run: uv run --locked --group validation python -m unittest discover -s tests -v
      - name: Check customer Docusaurus options syntax
        run: node --check examples/document-portal/examples/docusaurus-workspace.cjs
      - name: Install locked website dependencies
        run: npm --prefix website ci
      - name: Validate graph sources and privacy boundary
        run: npm --prefix website run test:graph
      - name: Build Docusaurus and reject broken links
        run: npm --prefix website run build
      - name: Install browser for graph smoke test
        run: npx --prefix website playwright install --with-deps chromium
      - name: Exercise graph interactions and document routes
        run: npm --prefix website run test:browser
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: website/build
