# yaml-language-server: $schema=../toolkit/workspace.schema.json
version: 1
name: AI Agents
profile: repository
method: issue-to-pr

work:
  system: github
  location: https://github.com/atstaeff/ai-agents/issues
review:
  system: github
  location: https://github.com/atstaeff/ai-agents/pulls
knowledge:
  system: repository
  location: toolkit/
decisions:
  system: repository
  location: workspace/decisions/
iteration_reports:
  system: repository
  location: workspace/iterations/
communication:
  system: assigned-work-item-or-current-request
  location: Assigned issue or PR; current conversation for direct requests
working_agreement: workspace/working-agreement.md
stakeholders: workspace/stakeholders.md

repositories:
  - name: ai-agents
    location: https://github.com/atstaeff/ai-agents
    path: .
    default_branch: main
handoff:
  location: Existing assigned work-item section or local work record
  template: templates/customer-workspace/workspace/handoff.md
reviewers: [atstaeff]
commands:
  setup: uv sync --locked --group docs
  start: python3 tools/ai_toolkit.py serve --workspace .
  check: uv run --locked --group docs python -m unittest discover -s tests -v
quality_gates:
  - name: Catalog and links
    command: python3 tools/ai_toolkit.py check
    required: true
  - name: Storage, API, exports and optional helpers
    command: uv run --locked --group docs python -m unittest discover -s tests -v
    required: true
  - name: Frontend syntax
    command: node --check tools/web/app.js
    required: true
  - name: Workspace publishing options
    command: node --check templates/customer-workspace/examples/docusaurus-workspace.cjs
    required: true
  - name: Strict documentation preview
    command: uv run --locked --group docs mkdocs build -f assets/mkdocs.yml --strict --site-dir "$PWD/workspace/generated/site"
    required: true
actions:
  edit_assigned_branch: within_assignment
  open_draft_pr: within_assignment
  update_work_item: within_assignment
  ask_questions: within_assignment
  merge: separate_authorization
  deploy: separate_authorization
  delete: separate_authorization
  change_access: separate_authorization
